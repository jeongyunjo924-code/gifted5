<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>교실 방탈출</title>
<style>
:root{
  --wall:#243056;      /* 방 벽: 깊은 남색 */
  --wall-2:#2E3C6B;
  --paper:#FFFFFF;     /* 문제 카드 */
  --brass:#E9B949;     /* 자물쇠·열쇠 */
  --brass-dk:#B8892A;
  --key:#EEF0FA;       /* 키패드 */
  --ink:#1D2645;
  --muted:#8C95B8;
  --bad:#E5484D;
  --good:#2FB67C;
  --r:clamp(10px,1.4vmin,18px);
  --gap:clamp(8px,1.6vmin,20px);
  font-family:"Pretendard","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--wall);color:#fff}
body{touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
  padding:env(safe-area-inset-top,0) env(safe-area-inset-right,0) env(safe-area-inset-bottom,0) env(safe-area-inset-left,0)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
button:focus-visible{outline:3px solid var(--brass);outline-offset:2px}

.app{height:100vh;height:100dvh;display:grid;grid-template-rows:auto minmax(0,1fr)}

/* ---------- 상단 ---------- */
.top{display:flex;align-items:center;gap:var(--gap);padding:var(--gap) calc(var(--gap)*1.4) 0;min-height:0}
.home{width:clamp(36px,6vmin,60px);height:clamp(36px,6vmin,60px);border-radius:calc(var(--r)*.8);background:var(--wall-2);display:grid;place-items:center;flex:none}
.home svg{width:58%;height:58%;fill:none;stroke:#fff;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.home:active{transform:scale(.94);background:#3C4A7E}
.sheet{position:relative}
.sheet .gear{position:absolute;top:clamp(10px,2vmin,20px);right:clamp(10px,2vmin,20px);background:#EEF0FA}
.sheet .gear svg{stroke:var(--ink)}
.set{display:grid;grid-template-columns:1fr 1fr;gap:clamp(12px,2.4vmin,28px);width:100%;text-align:left;min-height:0}
@media (orientation:portrait){.set{grid-template-columns:1fr}}
.set h3{font-size:clamp(15px,2.5vmin,24px);margin-bottom:.5em}
.set section{display:flex;flex-direction:column;gap:clamp(6px,1.2vmin,12px);min-height:0}
.rlist{display:flex;flex-direction:column;gap:6px;max-height:min(34dvh,300px);overflow-y:auto;overscroll-behavior:contain}
.ritem{display:flex;align-items:center;gap:.6em;background:#EEF0FA;border-radius:calc(var(--r)*.7);padding:.45em .7em;font-size:clamp(13px,2vmin,18px)}
.ritem b{font-size:1.1em}.ritem span{color:#6B7499;flex:1}
.ritem button{background:#FDE3E4;color:#B4232A;font-weight:800;border-radius:999px;padding:.35em .9em}
.empty{color:#8C95B8;font-size:clamp(13px,2vmin,18px);padding:.6em 0}
.btn.danger{background:#FDE3E4;color:#B4232A;box-shadow:0 5px 0 #F0B5B8}
.sheet.wide{width:min(94vw,980px)}
.row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.title{font-weight:800;font-size:clamp(16px,2.6vmin,28px);white-space:nowrap;letter-spacing:-.02em}
.team{font-size:clamp(13px,2vmin,20px);color:var(--muted);white-space:nowrap}
.locks{display:flex;gap:clamp(6px,1.4vmin,16px);margin-left:auto}
.lock{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:clamp(30px,5vmin,58px)}
.lock svg{width:clamp(22px,4vmin,40px);height:auto;overflow:visible}
.lock .body{fill:#46548A}
.lock .shackle{fill:none;stroke:#46548A;stroke-width:5;stroke-linecap:round;transition:transform .5s cubic-bezier(.3,1.6,.5,1)}
.lock.open .body{fill:var(--brass)}
.lock.open .shackle{stroke:var(--brass);transform:translate(9px,-7px) rotate(18deg);transform-origin:32px 22px}
.lock.now .body{fill:#7A87BD}
.lock.now .shackle{stroke:#7A87BD}
.frag{font-weight:800;font-size:clamp(11px,1.8vmin,18px);color:var(--brass);min-height:1.2em;line-height:1.2;letter-spacing:.04em}

/* ---------- 본 무대 ---------- */
.stage{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:var(--gap);padding:var(--gap) calc(var(--gap)*1.4) calc(var(--gap)*1.4);min-height:0}
@media (orientation:portrait){
  .stage{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) minmax(0,47%)}
}
.card{background:var(--paper);color:var(--ink);border-radius:var(--r);display:flex;flex-direction:column;min-height:0;padding:clamp(10px,2.2vmin,28px);box-shadow:0 0 0 4px var(--wall-2)}
.qhead{display:flex;align-items:baseline;gap:.6em;flex-wrap:wrap}
.qno{font-weight:800;font-size:clamp(18px,3.4vmin,38px);letter-spacing:-.02em}
.hint{background:#FFF4D6;border:2px solid var(--brass);border-radius:calc(var(--r)*.8);padding:.45em .8em;font-weight:800;font-size:clamp(16px,3vmin,32px);color:var(--ink);margin-bottom:clamp(6px,1.4vmin,14px)}
.hint[hidden]{display:none}
.prompt{font-weight:700;font-size:clamp(15px,2.8vmin,30px);line-height:1.35}
.visual{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding-top:clamp(6px,1.5vmin,18px)}
.visual svg{width:100%;height:100%;display:block}

/* ---------- 입력 패널 ---------- */
.panel{display:flex;flex-direction:column;gap:clamp(6px,1.3vmin,14px);min-height:0}
.status{display:flex;justify-content:space-between;align-items:center;font-size:clamp(13px,2vmin,19px);color:var(--muted)}
.status b{color:#fff}
.answer{min-height:clamp(52px,10vmin,100px);border-radius:var(--r);background:#1A2445;border:3px solid #3C4A7E;
  display:flex;align-items:center;justify-content:center;padding:0 .5em;overflow:hidden;
  font-weight:800;font-size:clamp(22px,5.4vmin,54px);letter-spacing:.12em;color:#fff;transition:border-color .15s,background .15s}
.answer .ch{display:inline-block}
.answer .ch.new{animation:pop .18s ease-out}
.answer .caret{display:inline-block;width:3px;height:1em;background:var(--brass);margin-left:.08em;animation:caret 1s steps(2) infinite}
.answer .ph{font-size:.45em;letter-spacing:0;color:#5F6C9E;font-weight:700}
.answer.ok{border-color:var(--good);background:#174A3A}
.answer.no{border-color:var(--bad);background:#4A1D2A;animation:shake .45s}
.msg{text-align:center;font-weight:700;font-size:clamp(13px,2.2vmin,22px);min-height:1.4em;line-height:1.4}
.msg.bad{color:#FF9A9D}.msg.good{color:#7BE3B5}.msg.info{color:var(--muted)}

.pad{flex:1;min-height:0;display:flex;flex-direction:column;gap:clamp(4px,1vmin,10px)}
.pad .kr{flex:1;min-height:0;display:flex;gap:clamp(3px,.8vmin,9px)}
.pad .kr .k{flex:1 1 0}
.pad .kr .x2{flex-grow:2}.pad .kr .x5{flex-grow:5}
.pad .k{font-size:clamp(14px,2.7vmin,30px)}
.k{min-width:0;padding:0;background:var(--key);color:var(--ink);border-radius:calc(var(--r)*.7);font-weight:800;font-size:clamp(16px,3.4vmin,38px);
  box-shadow:0 4px 0 #A9B0D3;transition:transform .06s,box-shadow .06s;min-height:0;display:grid;place-items:center}
.k:active,.k.hit{transform:translateY(3px);box-shadow:0 1px 0 #A9B0D3}
.k.fn{background:#C9CEE8;font-size:clamp(14px,2.4vmin,26px)}
.k.go{background:var(--brass);box-shadow:0 4px 0 var(--brass-dk);font-size:clamp(16px,2.8vmin,30px)}
.k.go:active,.k.go.hit{box-shadow:0 1px 0 var(--brass-dk)}
.k.go.ready{animation:glow 1s ease-in-out infinite alternate}
.span2{grid-column:span 2}.spanall{grid-column:1/-1}

/* ---------- 덮개 화면 ---------- */
.cover{position:fixed;inset:0;background:rgba(20,27,52,.92);display:grid;place-items:center;z-index:10;padding:var(--gap)}
.cover[hidden]{display:none}
.sheet{background:var(--paper);color:var(--ink);border-radius:calc(var(--r)*1.4);padding:clamp(18px,4vmin,48px);
  width:min(92vw,720px);max-height:92dvh;display:flex;flex-direction:column;gap:clamp(10px,2.2vmin,22px);align-items:center;text-align:center;animation:rise .35s ease-out}
.sheet h1{font-size:clamp(24px,5.5vmin,56px);letter-spacing:-.03em;line-height:1.15}
.sheet h2{font-size:clamp(20px,4vmin,40px);letter-spacing:-.02em}
.sheet p{font-size:clamp(14px,2.4vmin,24px);color:#4A5478;line-height:1.5}
.big-frag{font-size:clamp(34px,9vmin,96px);font-weight:900;color:var(--brass-dk);letter-spacing:.08em;line-height:1}
.btn{background:var(--brass);color:var(--ink);font-weight:800;font-size:clamp(16px,3vmin,30px);padding:.6em 1.6em;border-radius:999px;box-shadow:0 5px 0 var(--brass-dk)}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--brass-dk)}
.btn.ghost{background:#E6E9F5;box-shadow:0 5px 0 #B9C0DD}
.btn:disabled{opacity:.35}
.teams{display:grid;grid-template-columns:repeat(4,1fr);gap:clamp(6px,1.4vmin,14px);width:100%}
.teams button{padding:clamp(10px,2.4vmin,24px) 0;border-radius:var(--r);background:#EEF0FA;font-weight:800;font-size:clamp(16px,3vmin,30px);border:3px solid transparent}
.teams button.on{border-color:var(--brass-dk);background:#FFF4D6}
.recs{width:100%;border-top:2px solid #E1E4F0;padding-top:clamp(8px,1.6vmin,16px)}
.recs-h{font-weight:800;font-size:clamp(14px,2.2vmin,22px);text-align:left;margin-bottom:6px}
.recs-h span{font-weight:600;font-size:.75em;color:#8C95B8;margin-left:.4em}
.recs-g{display:grid;grid-template-columns:repeat(2,1fr);gap:clamp(6px,1.2vmin,12px)}
.recs-g button{background:#EEF0FA;border-radius:calc(var(--r)*.8);padding:clamp(6px,1.2vmin,12px) clamp(8px,1.6vmin,16px);text-align:left;display:grid;grid-template-columns:auto 1fr;column-gap:.6em;align-items:baseline}
.recs-g b{font-size:clamp(15px,2.4vmin,24px)}
.recs-g span{font-size:clamp(12px,1.9vmin,19px);color:#4A5478;font-weight:700;text-align:right}
.recs-g small{grid-column:1/-1;font-size:clamp(11px,1.6vmin,15px);color:#8C95B8}
.result{width:100%;border-collapse:collapse;font-size:clamp(14px,2.4vmin,24px)}
.result th,.result td{padding:.35em .5em;border-bottom:1px solid #E1E4F0}
.result th{color:#6B7499;font-weight:700;text-align:left}
.result td{text-align:right;font-weight:800}
.result tr.total td,.result tr.total th{color:var(--ink);border-bottom:0;font-size:1.1em}
.menu{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%}
.menu .btn{font-size:clamp(14px,2.4vmin,22px);padding:.55em .4em}
.pin{display:flex;gap:10px;justify-content:center}
.pin span{width:clamp(34px,7vmin,60px);height:clamp(42px,8vmin,70px);border-radius:10px;background:#EEF0FA;display:grid;place-items:center;font-size:clamp(20px,4vmin,40px);font-weight:900}
.pinpad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:min(100%,360px)}
.pinpad .k{height:clamp(40px,7.5vmin,70px)}

@keyframes pop{0%{transform:scale(.8)}100%{transform:scale(1)}}
@keyframes caret{50%{opacity:0}}
@keyframes shake{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
@keyframes glow{to{box-shadow:0 4px 0 var(--brass-dk),0 0 0 6px rgba(233,185,73,.35)}}
@keyframes rise{from{transform:translateY(24px) scale(.97);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <button class="home" id="home" aria-label="처음 화면으로"><svg viewBox="0 0 24 24"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v9.5h4.5v-5.5h4v5.5h4.5V10"/></svg></button>
    <div class="title" id="title">교실 방탈출</div>
    <div class="team" id="team"></div>
    <div class="locks" id="locks"></div>
    <button class="home gear" id="gear" aria-label="설정"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.8v2.4M12 18.8v2.4M2.8 12h2.4M18.8 12h2.4M5.5 5.5l1.7 1.7M16.8 16.8l1.7 1.7M5.5 18.5l1.7-1.7M16.8 7.2l1.7-1.7"/><circle cx="12" cy="12" r="6.6"/></svg></button>
  </header>
  <main class="stage">
    <section class="card">
      <div class="hint" id="hint" hidden></div>
      <div class="qhead"><div class="qno" id="qno"></div><div class="prompt" id="prompt"></div></div>
      <div class="visual" id="visual"></div>
    </section>
    <section class="panel">
      <div class="status"><span id="step"></span><span>이 문제 오답 <b id="wrong">0</b>회</span></div>
      <div class="answer" id="answer" aria-live="polite"></div>
      <div class="msg info" id="msg"></div>
      <div class="pad" id="pad"></div>
    </section>
  </main>
</div>
<div class="cover" id="cover" hidden><div class="sheet" id="sheet"></div></div>

<script>

const $ = s => document.querySelector(s);
const norm = s => String(s).normalize("NFKC").replace(/\s+/g,"").toUpperCase();
const firstAns = p => norm(Array.isArray(p.answer) ? p.answer[0] : p.answer);
const P = CONFIG.puzzles;
const FINAL = P.length;                     // 최종 문 인덱스
const finalCode = () => norm(CONFIG.finalCode);
const KEY = "classroom-escape-v1";
const RKEY = "classroom-escape-records";   // 끝낸 모둠 기록 (이 기기에 계속 남음)
function loadRecords(){ try{ return JSON.parse(localStorage.getItem(RKEY)) || []; }catch(e){ return []; } }
function saveRecords(r){ try{ localStorage.setItem(RKEY, JSON.stringify(r)); }catch(e){} }

let S = load() || fresh();
let input = "", busy = false;

function fresh(){ return {team:null, idx:0, wrong:Array(P.length+1).fill(0), start:null, end:null}; }
function load(){ try{ return JSON.parse(localStorage.getItem(KEY)); }catch(e){ return null; } }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }

/* ---------- 문제 그림 (모두 SVG라 화면 크기에 맞춰 선명하게 늘어남) ---------- */
const DRAW = {
  p1(){ // 디지털 숫자 표 (원본 비율 756×368)
    const bars = [[0,74,97],[272,74,186],[618,74,70],[97,220,175],[367,220,91],[618,220,70]];
    return `<svg viewBox="-4 -4 764 376" preserveAspectRatio="xMidYMid meet">
      <rect x="0" y="0" width="756" height="368" fill="#fff" stroke="#1D2645" stroke-width="3"/>
      ${bars.map(([x,y,w])=>`<rect x="${x}" y="${y}" width="${w}" height="74" fill="#000"/>`).join("")}</svg>`;
  },
  p2(){ // 꽃 원 4×3
    const grid = [[1,5,6,5],[3,1,5,3],[2,2,7,4]], c = 310;
    let s = `<svg viewBox="0 0 ${c*4} ${c*3}" preserveAspectRatio="xMidYMid meet">`;
    grid.forEach((row,r)=>row.forEach((n,i)=>{ s += `<image href="${IMG[n]}" x="${i*c+5}" y="${r*c+5}" width="300" height="300"/>`; }));
    return s + `</svg>`;
  },
  p3(){ return `<svg viewBox="0 0 1022 359" preserveAspectRatio="xMidYMid meet"><image href="${IMG[8]}" width="1022" height="359"/></svg>`; },
  p4(){
    const L = ["57 – 5 – 8","119 – 4 – 11","65 – 3 – 1 – 4","227 – 15 – 19"];
    return `<svg viewBox="0 0 640 440" preserveAspectRatio="xMidYMid meet">
      ${L.map((t,i)=>`<text x="320" y="${80+i*100}" text-anchor="middle" font-size="68" font-weight="800" fill="#1D2645" font-family="inherit">${t}</text>`).join("")}</svg>`;
  },
  p5(){
    const T = CONFIG.table5, w=[120,300,120], h=86, W=w[0]+w[1]+w[2];
    let s = `<svg viewBox="-3 -3 ${W+6} ${h*T.length+6}" preserveAspectRatio="xMidYMid meet"><g font-size="52" text-anchor="middle" fill="#1D2645" font-family="inherit">`;
    T.forEach((row,r)=>{ let x=0; row.forEach((v,i)=>{
      s += `<rect x="${x}" y="${r*h}" width="${w[i]}" height="${h}" fill="#fff" stroke="#1D2645" stroke-width="2"/>`;
      s += `<text x="${x+w[i]/2}" y="${r*h+h/2+18}" ${v==="?"?'fill="#E5484D" font-weight="800"':''}>${v}</text>`; x+=w[i]; }); });
    return s + `</g></svg>`;
  },
  final(){
    const frags = P.map(firstAns);
    const n = frags.length, cw = 1000/n;
    return `<svg viewBox="0 0 1000 520" preserveAspectRatio="xMidYMid meet" font-family="inherit">
      <rect x="40" y="20" width="920" height="480" rx="40" fill="#EEF0FA" stroke="#C9CEE8" stroke-width="6"/>
      <circle cx="500" cy="190" r="120" fill="none" stroke="#E9B949" stroke-width="18"/>
      <circle cx="500" cy="190" r="22" fill="#B8892A"/>
      ${[0,60,120,180,240,300].map(a=>`<line x1="500" y1="190" x2="${500+95*Math.cos(a*Math.PI/180)}" y2="${190+95*Math.sin(a*Math.PI/180)}" stroke="#E9B949" stroke-width="12" stroke-linecap="round"/>`).join("")}
      ${frags.map((f,i)=>`<g><text x="${cw*i+cw/2}" y="380" text-anchor="middle" font-size="26" fill="#8C95B8" font-weight="700">${i+1}번</text>
        <text x="${cw*i+cw/2}" y="445" text-anchor="middle" font-size="${f.length>3?50:60}" font-weight="900" fill="#1D2645">${f}</text></g>`).join("")}
    </svg>`;
  }
};

/* ---------- 상단 자물쇠 ---------- */
const LOCK_SVG = `<svg viewBox="0 0 64 70"><path class="shackle" d="M18 32V22a14 14 0 0 1 28 0v10"/><rect class="body" x="8" y="30" width="48" height="38" rx="8"/></svg>`;
function renderLocks(){
  $("#locks").innerHTML = P.map((p,i)=>{
    const st = i < S.idx ? "open" : i === S.idx ? "now" : "";
    return `<div class="lock ${st}" aria-label="${i+1}번 자물쇠 ${st==="open"?"열림":"잠김"}">${LOCK_SVG}<div class="frag">${i<S.idx?firstAns(p):""}</div></div>`;
  }).join("");
}

/* ---------- 화면 그리기 ---------- */
function render(){
  $("#team").textContent = S.team ? `${S.team}모둠` : "";
  renderLocks();
  if (S.idx > FINAL) return showResult();
  const isFinal = S.idx === FINAL;
  $("#qno").textContent = isFinal ? "마지막 문" : `[ ${S.idx+1}번 문제 ]`;
  $("#prompt").textContent = isFinal ? "자물쇠를 열 때 얻은 코드 조각을 떠올려 보세요." : P[S.idx].prompt;
  $("#hint").hidden = !isFinal;
  $("#hint").textContent = CONFIG.finalHint;
  $("#visual").innerHTML = isFinal ? DRAW.final() : DRAW[P[S.idx].draw]();
  $("#step").innerHTML = isFinal ? `<b>최종 탈출 코드</b>` : `<b>${S.idx+1}</b> / ${P.length} 문제`;
  $("#wrong").textContent = S.wrong[S.idx];
  input = ""; setMsg("", "info");
  renderAnswer(); renderPad();
}

function renderAnswer(state, fresh){
  const el = $("#answer");
  el.className = "answer" + (state ? " " + state : "");
  if (!input) { el.innerHTML = state ? "" : `<span class="ph">아래 키로 답을 입력하세요</span><span class="caret"></span>`; }
  else el.innerHTML = [...input].map((c,i)=>`<span class="ch ${fresh && i===input.length-1?"new":""}">${c}</span>`).join("") + (state ? "" : `<span class="caret"></span>`);
  const go = document.querySelector(".k.go");
  if (go) go.classList.toggle("ready", input.length > 0 && !state);
}

function renderPad(){   // 모든 문제에서 같은 키패드 (숫자+알파벳)
  const keys = s => s.split("").map(k=>`<button class="k" data-k="${k}">${k}</button>`).join("");
  $("#pad").innerHTML =
      `<div class="kr">${keys("1234567890")}</div>`
    + `<div class="kr">${keys("ABCDEFG")}</div><div class="kr">${keys("HIJKLMN")}</div><div class="kr">${keys("OPQRSTU")}</div>`
    + `<div class="kr">${keys("VWXYZ")}<button class="k fn x2" data-k="DEL" aria-label="한 글자 지우기">⌫</button></div>`
    + `<div class="kr"><button class="k fn x2" data-k="CLR">전체 지우기</button><button class="k go x5" data-k="GO">확인</button></div>`;
  renderAnswer();
}

function setMsg(t, cls){ const m=$("#msg"); m.textContent=t; m.className="msg "+cls; }

/* ---------- 입력 처리 ---------- */
function press(k){
  if (busy || S.idx > FINAL || !S.team) return;
  if (k === "DEL") input = input.slice(0,-1);
  else if (k === "CLR") input = "";
  else if (k === "GO") return check();
  else if (input.length < CONFIG.maxLength) input += k;
  else { setMsg("더 이상 입력할 수 없어요. ⌫로 지우세요.", "info"); return; }
  setMsg("", "info");
  renderAnswer(null, !["DEL","CLR"].includes(k));
}

function check(){
  if (!input){ setMsg("답을 입력한 뒤 확인을 누르세요.", "info"); return; }
  const ok = S.idx === FINAL
    ? norm(input) === finalCode()
    : [].concat(P[S.idx].answer).some(a => norm(a) === norm(input));
  if (ok) return success();
  S.wrong[S.idx]++; save();
  $("#wrong").textContent = S.wrong[S.idx];
  busy = true; renderAnswer("no");
  setMsg("자물쇠가 열리지 않았어요. 다시 생각해 보세요.", "bad");
  setTimeout(()=>{ busy=false; input=""; renderAnswer(); }, 900);
}

function success(){
  busy = true; renderAnswer("ok"); setMsg("찰칵! 자물쇠가 열렸어요.", "good");
  const wasFinal = S.idx === FINAL, frag = wasFinal ? "" : firstAns(P[S.idx]);
  S.idx++;
  if (wasFinal){
    S.end = Date.now();
    const r = loadRecords(); r.unshift({team:S.team, start:S.start, end:S.end, wrong:S.wrong.slice()}); saveRecords(r);
  }
  save();
  renderLocks();
  setTimeout(()=>{
    busy = false;
    if (wasFinal) return showResult();
    const last = S.idx === FINAL;
    openSheet(`<h2>${S.idx}번 자물쇠 해제!</h2><p>코드 조각을 얻었어요. 위쪽 자물쇠 아래에 저장됩니다.</p>
      <div class="big-frag">${frag}</div>
      <button class="btn" id="next">${last ? "마지막 문으로" : "다음 문제로"}</button>`);
    $("#next").onclick = ()=>{ closeSheet(); render(); };
  }, 700);
}

/* ---------- 덮개 화면들 ---------- */
function openSheet(h, wide){ $("#sheet").className = "sheet" + (wide ? " wide" : ""); $("#sheet").innerHTML = h; $("#cover").hidden = false; }
function closeSheet(){ $("#cover").hidden = true; }

function showStart(){
  let pick = null;
  const recs = loadRecords().slice(0, 4);
  const recHtml = recs.length ? `<div class="recs"><div class="recs-h">지난 기록 <span>눌러서 자세히 보기</span></div>
      <div class="recs-g">${recs.map((r,i)=>`<button data-r="${i}"><b>${r.team}모둠</b><span>${fmtTime(r.end-r.start)} · 오답 ${r.wrong.reduce((a,b)=>a+b,0)}회</span><small>${fmtWhen(r.end)}</small></button>`).join("")}</div></div>` : "";
  openSheet(`<h1>교실 방탈출</h1><p>자물쇠 ${P.length}개를 풀고 마지막 문을 열면 탈출!<br>우리 모둠을 고르세요.</p>
    <div class="teams">${Array.from({length:CONFIG.teamCount},(_,i)=>`<button data-t="${i+1}">${i+1}모둠</button>`).join("")}</div>
    <button class="btn" id="start" disabled>시작하기</button>${recHtml}
    <button class="home gear" id="gear2" aria-label="설정"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.8v2.4M12 18.8v2.4M2.8 12h2.4M18.8 12h2.4M5.5 5.5l1.7 1.7M16.8 16.8l1.7 1.7M5.5 18.5l1.7-1.7M16.8 7.2l1.7-1.7"/><circle cx="12" cy="12" r="6.6"/></svg></button>`);
  $("#gear2").onclick = askPin;
  document.querySelectorAll(".teams button").forEach(b=>b.onclick=()=>{
    document.querySelectorAll(".teams button").forEach(x=>x.classList.remove("on"));
    b.classList.add("on"); pick = b.dataset.t; $("#start").disabled = false;
  });
  document.querySelectorAll("[data-r]").forEach(b=>b.onclick=()=>showResult(recs[+b.dataset.r], true));
  $("#start").onclick = ()=>{ S = fresh(); S.team = pick; S.start = Date.now(); save(); closeSheet(); render(); };
}

function fmtTime(ms){ const s=Math.round(ms/1000); return `${Math.floor(s/60)}분 ${String(s%60).padStart(2,"0")}초`; }
function fmtWhen(ms){ const d=new Date(ms), z=n=>String(n).padStart(2,"0"); return `${d.getMonth()+1}/${d.getDate()} ${z(d.getHours())}:${z(d.getMinutes())}`; }
function showResult(rec, past){
  const R = rec || {team:S.team, start:S.start, end:S.end||Date.now(), wrong:S.wrong};
  const rows = P.map((_,i)=>`<tr><th>${i+1}번 문제</th><td>${R.wrong[i]}회</td></tr>`).join("")
    + `<tr><th>마지막 문</th><td>${R.wrong[FINAL]}회</td></tr>`;
  const total = R.wrong.reduce((a,b)=>a+b,0);
  openSheet(`<h1>${past ? `${R.team}모둠 기록` : "탈출 성공!"}</h1><p>${past ? `${fmtWhen(R.end)} · ` : `${R.team}모둠 · `}걸린 시간 ${fmtTime(R.end-R.start)}</p>
    <table class="result"><tbody>${rows}<tr class="total"><th>오답 합계</th><td>${total}회</td></tr></tbody></table>
    ${past ? "" : `<p style="font-size:clamp(12px,1.8vmin,16px)">이 화면을 선생님께 보여 주세요. 기록은 처음 화면에서도 다시 볼 수 있어요.</p>`}
    <button class="btn" id="toStart">${past ? "돌아가기" : "처음 화면으로"}</button>`);
  $("#toStart").onclick = ()=>{
    if (!past){ S = fresh(); save(); render(); }
    showStart();
  };
}

/* ---------- 설정 (선생님 비밀번호 필요). 제목 3초 길게 누르기로도 열림 ---------- */
let holdT;
$("#title").addEventListener("pointerdown", ()=>{ holdT = setTimeout(askPin, 3000); });
["pointerup","pointerleave","pointercancel"].forEach(e=>$("#title").addEventListener(e, ()=>clearTimeout(holdT)));
function backFromMenu(){ if (!S.team) showStart(); else if (S.idx > FINAL) showResult(); else closeSheet(); }
function askPin(){
  if (!CONFIG.teacherPin) return teacherMenu();
  let pin = "";
  const draw = ()=>{ $("#pinv").innerHTML = Array.from({length:4},(_,i)=>`<span>${pin[i]?"●":""}</span>`).join(""); };
  openSheet(`<h2>설정</h2><p>선생님 비밀번호 4자리를 입력하세요.</p><div class="pin" id="pinv"></div>
    <div class="pinpad">${"123456789".split("").map(k=>`<button class="k" data-p="${k}">${k}</button>`).join("")}
    <button class="k fn" data-p="X">닫기</button><button class="k" data-p="0">0</button><button class="k fn" data-p="D">⌫</button></div>`);
  draw();
  document.querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>{
    const v=b.dataset.p;
    if (v==="X") return backFromMenu();
    if (v==="D") pin=pin.slice(0,-1); else if (pin.length<4) pin+=v;
    draw();
    if (pin.length===4){ if (pin===CONFIG.teacherPin) teacherMenu(); else { pin=""; setTimeout(draw,250); } }
  });
}
function teacherMenu(){
  const recs = loadRecords();
  openSheet(`<h2>설정</h2>
    <div class="set">
      <section>
        <h3>지난 기록 (${recs.length}개)</h3>
        ${recs.length ? `<div class="rlist">${recs.map((r,i)=>`<div class="ritem"><b>${r.team}모둠</b><span>${fmtWhen(r.end)} · 오답 ${r.wrong.reduce((a,b)=>a+b,0)}회</span><button data-del="${i}">삭제</button></div>`).join("")}</div>
          <button class="btn danger" id="wipe">기록 모두 지우기</button>` : `<div class="empty">저장된 기록이 없어요.</div>`}
      </section>
      <section>
        <h3>진행 중인 게임</h3>
        <div class="menu">${P.map((_,i)=>`<button class="btn ghost" data-go="${i}">${i+1}번</button>`).join("")}
          <button class="btn ghost" data-go="${FINAL}">마지막 문</button></div>
        <button class="btn ghost" id="reset">처음부터 다시</button>
      </section>
    </div>
    <button class="btn" id="close">닫기</button>`, true);
  document.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{
    const r = loadRecords(); r.splice(+b.dataset.del, 1); saveRecords(r); teacherMenu();
  });
  const wipe = $("#wipe");
  if (wipe) wipe.onclick = ()=>{
    if (wipe.dataset.sure){ saveRecords([]); teacherMenu(); }
    else { wipe.dataset.sure = "1"; wipe.textContent = "한 번 더 누르면 모두 지워져요"; }
  };
  document.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>{
    S.idx=+b.dataset.go; S.end=null; if(!S.team){S.team="1";} if(!S.start)S.start=Date.now(); save(); closeSheet(); render(); });
  $("#reset").onclick = ()=>{ S = fresh(); save(); render(); showStart(); };
  $("#close").onclick = backFromMenu;
}

/* ---------- 설정 버튼 ---------- */
$("#gear").onclick = askPin;

/* ---------- 처음 화면으로 ---------- */
$("#home").onclick = ()=>{
  if (!S.team) return showStart();
  openSheet(`<h2>처음 화면으로 갈까요?</h2><p>돌아가면 지금까지 푼 기록과 오답 횟수가 지워지고<br>모둠 선택부터 다시 시작해요.</p>
    <div class="row"><button class="btn ghost" id="stay">계속 풀기</button><button class="btn" id="goHome">처음 화면으로</button></div>`);
  $("#stay").onclick = ()=> S.idx>FINAL ? showResult() : closeSheet();
  $("#goHome").onclick = ()=>{ S = fresh(); save(); render(); showStart(); };
};

/* ---------- 이벤트 ---------- */
$("#pad").addEventListener("click", e=>{ const b=e.target.closest(".k"); if(b) press(b.dataset.k); });
document.addEventListener("keydown", e=>{        // 전자칠판·키보드 연결 시
  if (!$("#cover").hidden) return;
  const k = e.key.toUpperCase();
  if (/^[0-9A-Z]$/.test(k)){ flash(k); press(k); }
  else if (e.key==="Backspace"){ flash("DEL"); press("DEL"); }
  else if (e.key==="Enter"){ flash("GO"); press("GO"); }
});
function flash(k){ const b=document.querySelector(`.k[data-k="${k}"]`); if(b){ b.classList.add("hit"); setTimeout(()=>b.classList.remove("hit"),110); } }
document.addEventListener("contextmenu", e=>e.preventDefault());
document.addEventListener("gesturestart", e=>e.preventDefault());

render();
if (!S.team) showStart(); else if (S.idx > FINAL) showResult();
</script>
</body>
</html>
